name: 'Git CLI for Actions'
description: 'A Git CLI alternative that runs seamlessly in GitHub Actions'
runs:
  using: 'composite'
  steps:
    - name: Run Git command inside Docker
      shell: bash
      run: |
        docker run --rm -v $GITHUB_WORKSPACE:/repo my-org/git-cli-for-actions git ${{ inputs.command }}

inputs:
  command:
    description: 'Git command to run'
    required: true
    default: 'status'