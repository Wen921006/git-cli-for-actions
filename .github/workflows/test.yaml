name: Git CLI for Actions 테스트

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  git-cli-test:
    name: Git 명령 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Git 버전 확인
        uses: KangYoungIn/git-cli-for-actions@v1.0.0
        with:
          command: 'version'

      - name: Git 상태 확인
        uses: KangYoungIn/git-cli-for-actions@v1.0.0
        with:
          command: 'status'

      - name: Git 로그 확인
        uses: KangYoungIn/git-cli-for-actions@v1.0.0
        with:
          command: 'log'

      - name: 테스트 종료
        run: echo "Git CLI for Actions 테스트 완료"
